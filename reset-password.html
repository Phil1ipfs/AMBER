<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Amber</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Choose a new password for your Amber account.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <!-- Brand panel: food photo with red overlay -->
        <aside class="auth-visual" aria-hidden="true">
            <img class="auth-photo" src="asset/image/CHICKEN/Garlic Fried Chicken.jpg" alt="" width="1784" height="1338">
            <div class="auth-visual-shape"></div>
            <div class="auth-visual-corner"></div>
            <img class="auth-visual-leaf" src="asset/image/decor/leaf-sprig.svg" alt="">
            <div class="auth-visual-content">
                <div class="auth-logo"><img src="asset/image/amberlogo.png" alt="" width="166" height="84"></div>
                <p class="auth-tagline">Authentic<br>Filipino Food
                    <svg class="auth-rays" viewBox="0 0 40 40"><path d="M6 30L18 20M10 38l16-6M4 20l10-10"/></svg>
                </p>
                <p class="auth-tagline-sub">Traditional flavors,<br>made with love.
                    <svg class="auth-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
                </p>
            </div>
        </aside>

        <!-- Form panel -->
        <section class="auth-main" aria-labelledby="auth-title">
            <a class="auth-back" href="index.html">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                Back to Amber
            </a>

            <div class="auth-head">
                <p class="auth-script">Almost there!</p>
                <h1 id="auth-title">Choose a new password</h1>
                <svg class="auth-head-rays" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 30l8-14M24 34l14-10M22 44h16"/></svg>
                <p class="auth-sub">Enter a new password for your Amber account.</p>
            </div>

            <form class="auth-form" data-auth-form="reset" novalidate>
                <div class="auth-alert" role="alert" hidden></div>

                <div class="auth-field">
                    <label for="password">New Password</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a new password" minlength="8" required aria-describedby="password-hint password-error">
                        <button class="toggle-password" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.9 0 3.5-.6 4.9-1.4M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                        </button>
                    </div>
                    <p class="field-hint" id="password-hint">Use at least 8 characters.</p>
                    <p class="field-error" id="password-error"></p>
                </div>

                <div class="auth-field">
                    <label for="confirm">Confirm New Password</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                        <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Confirm your new password" required aria-describedby="confirm-error">
                        <button class="toggle-password" type="button" data-toggle-password="confirm" aria-label="Show password" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.9 0 3.5-.6 4.9-1.4M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                        </button>
                    </div>
                    <p class="field-error" id="confirm-error"></p>
                </div>

                <button class="btn btn-cta btn-block auth-submit" type="submit">
                    <span class="btn-label">Save new password</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    <span class="spinner" aria-hidden="true"></span>
                </button>

            </form>

            <p class="auth-switch">Remembered it? <a href="login.html" data-auth-nav>Back to Log in</a></p>

            <img class="auth-sun" src="asset/image/decor/sun.svg" alt="">
        </section>
    </main>

    <!-- Supabase Auth (settings in supabase-config.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="account.js"></script>
    <script src="auth.js"></script>
</body>
</html>
